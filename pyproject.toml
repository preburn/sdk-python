[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "preburn"
version = "0.1.0"
description = "Python client for Preburn, which decides before each AI call whether to allow, route, cap or deny it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Preburn Authors" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai>=3"]

[project.urls]
Homepage = "https://github.com/preburn/sdk-python"
Source = "https://github.com/preburn/sdk-python"
Issues = "https://github.com/preburn/sdk-python/issues"
Changelog = "https://github.com/preburn/sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "jsonschema>=4.26",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "types-jsonschema>=4.26",
]

[tool.ruff]
line-length = 100
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["D"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["integration: needs a running Preburn server named by PREBURN_BASE_URL"]
